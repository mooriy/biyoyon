<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7ed">
  <title>びよよ～ん | ふって、のばして、ひとやすみ。</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <a class="brand" href="./" aria-label="びよよ～ん ホーム">
        <span class="brand-mark" aria-hidden="true">✳</span>
        <span>びよよ～ん</span>
      </a>
      <span class="header-tag">ちいさな、ひとやすみ。</span>
    </header>

    <section class="intro" aria-labelledby="title">
      <div class="eyebrow"><span></span> あそびかたは、とってもかんたん</div>
      <h1 id="title">ふって、のばして、<br><em>びよよ～ん。</em></h1>
      <p>なんだかいそがしい毎日に。<br>びよよ～んとして、ちょっとひと息。</p>
    </section>

    <section class="playground" aria-label="びよよ～んであそぶ">
      <div class="playground-top">
        <span class="play-label"><span class="play-dot"></span> PLAY TIME</span>
        <span class="sound-label">のびて、もどって。<span aria-hidden="true"> ✳</span></span>
      </div>
      <div class="scene" id="scene">
        <div class="scene-orbit orbit-one"></div>
        <div class="scene-orbit orbit-two"></div>
        <span class="scene-star star-one" aria-hidden="true">✳</span>
        <span class="scene-star star-two" aria-hidden="true">✦</span>
        <span class="scene-star star-three" aria-hidden="true">✧</span>
        <span class="scene-squiggle" aria-hidden="true">〰</span>
        <span class="scene-note note-left">ふりふり<br><span>♪</span></span>
        <span class="scene-note note-right">びよ〜ん！</span>
        <canvas id="toy" role="button" tabindex="0" aria-label="びよよ～んを発射。丸い先端はドラッグして動かせます。"></canvas>
        <button id="fullscreen-close" class="fullscreen-close" type="button" aria-label="全画面表示を閉じる" hidden>×</button>
        <div class="scene-caption"><span>✦</span> タップで はっしゃ！ <span>✦</span></div>
      </div>

      <div class="controls">
        <button id="launch" class="launch-button" type="button">
          <span class="button-sparkle">✳</span>
          <span>びよよ～ん！</span>
          <span class="button-arrow">↗</span>
        </button>
        <button id="motion" class="motion-button" type="button">
          <span aria-hidden="true">⌁</span> スマホをふってあそぶ
        </button>
        <button id="fullscreen" class="motion-button fullscreen-button" type="button" aria-pressed="false">
          <span aria-hidden="true">⛶</span> 画面いっぱいであそぶ
        </button>
        <p id="motion-status" class="motion-status" role="status">動きセンサーを確認しています…</p>
      </div>
    </section>

    <section class="howto" aria-label="あそびかた">
      <div class="howto-heading"><span>HOW TO PLAY</span><i></i><span>あそびかた</span></div>
      <div class="steps">
        <div class="step"><span class="step-icon">⌁</span><div><strong>ふってみる</strong><small>スマホをやさしくふる</small></div><span class="step-number">01</span></div>
        <div class="step"><span class="step-icon">↗</span><div><strong>のばしてみる</strong><small>タップして、びよ〜ん</small></div><span class="step-number">02</span></div>
        <div class="step"><span class="step-icon">♡</span><div><strong>ひとやすみ</strong><small>ゆらゆらながめて、ほっ。</small></div><span class="step-number">03</span></div>
      </div>
    </section>
    <footer><span>✳ びよよ～ん</span><span>きょうも、ゆるりと。</span></footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
